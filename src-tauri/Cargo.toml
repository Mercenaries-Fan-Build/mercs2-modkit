[package]
name = "mercs2-modkit"
version = "0.1.0"
description = "Mercenaries 2 mod manager: load, validate, merge, and assemble patch WADs"
authors = ["Mercenaries Fan Build Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mercs2_modkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Deep link (`mercs2-modkit://ship?path=…`) so the Workshop's "Send to Modkit" hands a Shipment
# straight into the app. On Windows/Linux a deep link relaunches the exe with the URL in argv, so
# single-instance forwards that argv to the running window (its callback scans it) instead of
# opening a second copy; the initial/cold-start launch is delivered via the deep-link plugin's
# `on_open_url`. Kept without the single-instance `deep-link` feature so the two paths don't both
# fire for one URL.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Reading the `shipment:` head of a Quartermaster manifest at ingest, so a staged Shipment is
# identified by its own declared name and version rather than by the folder the user happened to
# put it in. qm accepts YAML, JSON and TOML, so all three are parsed — and these are the exact
# crates `mercs2_quartermaster` itself parses with, so a manifest qm accepts is one modkit reads
# the same way. Only the two-field head is deserialized: qm owns the rest of the schema, and
# mirroring it here would make every qm release a modkit breakage.
#
# Deliberately NOT a dependency on `mercs2_quartermaster` itself. Linking the whole builder to
# read two strings would drag in clap, png and wad_simulator, and would pin a library version
# against the `qm` *binary* the toolchain downloads at runtime — two copies of qm that could
# disagree.
serde_norway = "0.9"
toml = "1"

# Mercenaries 2 format libraries — resolved from crates.io.
#
# NEVER add a `path` here. modkit is an application, not a published crate, so cargo always
# prefers the path over the registry — including in CI, which has no sibling checkout of the
# wad_simulator repo. (A `path` alongside a `version` IS ignored when *packaging a library*
# for publication; that does not apply to a binary, and assuming it did broke the release.)
# Develop against a local checkout with `[patch.crates-io]` or `cargo add --path`, not here.

# `PatchBlock::from_decompressed` (correct `packed_field` — 1.0 hardcoded it to 1, sizing the
# engine's decompression buffer at a single 32 KB page), `validate_blocks` (one primary ASET
# row per hash), `sges::compressed_len`, `scripts_block` (Lua editing), `texture::replace_body`.
mercs2_formats = "3.5"
loadprobe = "2.2"

# Lua 5.1 compiler emitting the game's exact bytecode dialect (float lua_Number, 32-bit
# size_t). The wardrobe is pure Lua: modkit recompiles `wifpmcinterior` with each mod's
# outfits appended. Verified byte-for-byte against the reference luac.exe.
mercs2_luac = "1.1"

# Model container -> indexed triangle geometry, for the 3D texture viewer. Pure decode: it
# was carved out of `mercs2_engine` precisely so a GUI can use it without linking wgpu/winit.
mercs2_mesh = "1.0.1"

# HTTP client for fetching the wad_simulator release binary (rustls to avoid system OpenSSL)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Unpacking downloaded mod release artifacts
zip = "2"

# Async sleep, for one thing only: honouring mercs.ink's `Retry-After` on a 429 (API spec §3).
# `std::thread::sleep` inside an async command would park a runtime worker rather than yield it.
# Tauri already builds on tokio, so this names a dependency that was always linked; the `rt`
# feature is what lets the tests drive `fetch` on a current-thread runtime without the network.
tokio = { version = "1", default-features = false, features = ["time", "rt"] }

# Game-file integrity verification: MD5 hashing, parallelized across files
md-5 = "0.10"
sha2 = "0.10"
rayon = "1"

# Texture swapping: decode the user's PNG/JPG and resize it to the donor's exact
# dimensions (`image`), then re-encode to the donor's own BC1/BC3 format (`texpresso`,
# a pure-Rust squish port — no C toolchain).
#
# These deliberately live HERE and not in `mercs2_formats`, whose whole selling point is
# that its only dependency is `flate2`. The library exposes just the dependency-free byte
# primitive (`texture::replace_body`); the pixel work is the app's problem.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
texpresso = "2"

[dev-dependencies]
tempfile = "3"
