name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Strips maintainer-only UI (e.g. the reference-manifest card) from pipeline
# release builds. Local `tauri dev`/`tauri build` leave it unset, so it shows.
env:
  VITE_RELEASE_BUILD: "true"

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set release version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
            echo "Stamping build with version $VERSION"
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p));c.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');"
          else
            echo "Not a tag build; keeping version from tauri.conf.json"
          fi

      - name: Build Tauri app (Linux x64)
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage
        env:
          # Signs the AppImage updater artifact (required by createUpdaterArtifacts).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mercs2-modkit-linux-x86_64
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/mercs2-modkit
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

      - name: Attach to GitHub release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

  flatpak:
    needs: linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Determine release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Flatpak bundle version: $VERSION"

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: mercs2-modkit-linux-x86_64
          path: artifacts

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Stage .deb next to the manifest
        run: |
          deb=$(find artifacts -name '*.deb' | head -n1)
          test -n "$deb" || { echo "No .deb found in artifacts"; exit 1; }
          cp "$deb" src-tauri/flatpak/app.deb

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --repo=repo \
            build-dir src-tauri/flatpak/com.mercenaries_fan_build.modkit.yml
          flatpak build-bundle repo "mercs2-modkit-${VERSION}-x86_64.flatpak" \
            com.mercenaries_fan_build.modkit

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mercs2-modkit-linux-flatpak
          path: mercs2-modkit-${{ env.VERSION }}-x86_64.flatpak
          if-no-files-found: error

      - name: Attach to GitHub release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mercs2-modkit-${{ env.VERSION }}-x86_64.flatpak

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Set release version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
            echo "Stamping build with version $VERSION"
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p));c.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');"
          else
            echo "Not a tag build; keeping version from tauri.conf.json"
          fi

      - name: Build Tauri app (Windows x64)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis
        env:
          # Signs the NSIS updater artifact (required by createUpdaterArtifacts).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Package portable zip (exe + manifest)
        shell: pwsh
        run: |
          $zip = "mercs2-modkit-portable-windows-x86_64.zip"
          $stage = "portable-stage"
          New-Item -ItemType Directory -Path "$stage/manifests" | Out-Null
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/mercs2-modkit.exe" "$stage/"
          Copy-Item "manifests/mercs2.manifest.json" "$stage/manifests/"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          echo "PORTABLE_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mercs2-modkit-windows-x86_64
          path: |
            ${{ env.PORTABLE_ZIP }}
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

      - name: Attach to GitHub release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PORTABLE_ZIP }}
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe

  # Builds the Tauri-updater manifest (latest.json) that installed copies of
  # modkit poll via releases/latest/download/latest.json, pointing at this
  # release's signed NSIS installer and AppImage.
  updater-manifest:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mercs2-modkit-*-x86_64
          path: artifacts

      - name: Assemble latest.json
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          exe=$(find artifacts -name '*-setup.exe' | head -n1)
          appimage=$(find artifacts -name '*.AppImage' | head -n1)
          test -n "$exe" || { echo "No NSIS installer in artifacts"; exit 1; }
          test -n "$appimage" || { echo "No AppImage in artifacts"; exit 1; }
          test -f "$exe.sig" || { echo "Missing $exe.sig — was TAURI_SIGNING_PRIVATE_KEY set?"; exit 1; }
          test -f "$appimage.sig" || { echo "Missing $appimage.sig — was TAURI_SIGNING_PRIVATE_KEY set?"; exit 1; }

          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "See ${base%download/*}tag/${GITHUB_REF_NAME} for release notes." \
            --arg win_url "$base/$(basename "$exe")" \
            --arg win_sig "$(cat "$exe.sig")" \
            --arg linux_url "$base/$(basename "$appimage")" \
            --arg linux_sig "$(cat "$appimage.sig")" \
            '{
              version: $version,
              pub_date: $pub_date,
              notes: $notes,
              platforms: {
                "windows-x86_64": { url: $win_url, signature: $win_sig },
                "linux-x86_64": { url: $linux_url, signature: $linux_sig }
              }
            }' > latest.json
          cat latest.json

      - name: Attach latest.json to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
